# -- lakeFS -> Airflow event listener (subchart, OCI)
# @section -- Event listener
dug-lakefs-event-listeners:
  # off by default: it needs the metadata DB secret wired below, and the
  # lakeFS actions installed in the source repos, before it does anything
  enabled: false
  airflow:
    metadataSecret:
      # the same secret the scheduler uses; `airflow dags trigger` writes
      # the DagRun through the DB, so this is what it authenticates with
      name: "search-metadata"
      key: connection
  hook:
    # must match ROGER_HOOK_TOKEN in the lakeFS server environment, which
    # is where the action resolves {{ ENV.ROGER_HOOK_TOKEN }}
    token: ""
  dags:
    default: annotate_and_index
    # KGX repos are deliberately not wired: knowledge_graph_build downloads
    # tens of GB and bulk-loads, so it is triggered deliberately
    map: {}
