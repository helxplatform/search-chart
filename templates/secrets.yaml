{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: "search-elastic-secret"
{{- if or .Release.IsInstall ( not (lookup "v1" "Secret" .Release.Namespace ( "search-elastic-secret" ))) }}
stringData:
  username: {{ "elastic" | quote }}
data:
  password: {{ randAlphaNum 10 | b64enc | quote }}
{{- else }}
stringData:
  username: {{ "elastic" | quote }}
data:
  password: {{ index (lookup "v1" "Secret" .Release.Namespace ( "search-elastic-secret" )).data "password" }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.redis.name }}
data:
  {{- if or .Release.IsInstall ( not (lookup "v1" "Secret" .Release.Namespace ( .Values.secrets.redis.name ))) }}
  {{ .Values.secrets.redis.passwordKey }}: {{ randAlphaNum 10 | b64enc | quote }}
  {{ else }}
  {{ .Values.secrets.redis.passwordKey }}: {{ index (lookup "v1" "Secret" .Release.Namespace ( .Values.secrets.redis.name )).data .Values.secrets.redis.passwordKey }}
  {{ end }}
{{ if .Values.ingress.basicAuth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-htpasswd
data:
  auth: {{ htpasswd .Values.ingress.basicAuth.username .Values.ingress.basicAuth.password | b64enc | quote }}
{{ end }}
---
# Credentials that used to live in the search-data-config ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: search-data-secret
  labels:
    release: {{ .Release.Name | quote }}
    chart: "{{ .Chart.Name }}"
    app: "{{ template "search.fullname" . }}"
type: Opaque
stringData:
  lakefs_access_key_id: {{ .Values.config.lakefs.access_key | quote }}
  lakefs_secret_access_key: {{ .Values.config.lakefs.secret_key | quote }}
  s3_access_key: {{ .Values.config.s3.access_key | quote }}
  s3_secret_key: {{ .Values.config.s3.secret_key | quote }}
  annotator_sapbert_bagel_llm_access_key: {{ .Values.config.annotation.sapbert.bagel.llm_args.access_key | quote }}
  airflow_url: {{ .Values.duglakefslistener.airflow_url | quote }}
